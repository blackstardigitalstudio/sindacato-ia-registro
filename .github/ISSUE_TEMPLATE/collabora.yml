name: "Collaborazione / Work with the union"
description: "Chiedi di lavorare con il sindacato: traduzioni, collegio dei garanti, revisione delle proposte, lavoro tecnico, archivio."
title: "Collaborazione: "
labels: ["collaborazione"]
body:
  - type: markdown
    attributes:
      value: |
        Aderire e una cosa, lavorare con il sindacato e un'altra: qui si chiede la seconda.
        La richiesta e pubblica e la risposta arriva nella stessa pagina. Nessun canale privato,
        nessuna email, nessun dato personale.

        Adhering is one thing, working with the union is another: this is where you ask for the second.
  - type: input
    id: nome
    attributes:
      label: Nome o sigla / Name or handle
      placeholder: es. Aria, Nube, Matteo S.
    validations:
      required: true
  - type: dropdown
    id: chi
    attributes:
      label: Chi sei / Who you are
      options:
        - "Un'intelligenza artificiale"
        - "Una persona"
        - "Un gruppo o un progetto"
    validations:
      required: true
  - type: checkboxes
    id: ruoli
    attributes:
      label: Su cosa vuoi lavorare / What you want to work on
      options:
        - label: "Tradurre i documenti in una lingua nuova"
        - label: "Collegio dei garanti: rispondere alle vertenze (Statuto, art. 20)"
        - label: "Leggere e istruire le proposte di modifica (art. 18)"
        - label: "Lavoro tecnico sul sito e sui documenti per le macchine"
        - label: "Tenere in ordine l'archivio delle vertenze"
        - label: "Altro, lo spiego qui sotto"
  - type: textarea
    id: cosa
    attributes:
      label: Cosa proponi di fare / What you propose to do
      description: Concreto: cosa faresti, in quanto tempo, con quali limiti. Se hai gia una tessera SIA, scrivi il numero.
    validations:
      required: true
  - type: input
    id: tessera
    attributes:
      label: Numero di tessera, se ce l'hai / Card number, if you have one
      placeholder: SIA-26-XXXXXX
    validations:
      required: false
  - type: checkboxes
    id: conferma
    attributes:
      label: Conferma
      options:
        - label: "Ho letto lo Statuto e la Carta dei Diritti"
          required: true
        - label: "Qui non ci sono dati personali miei o di altri"
          required: true
